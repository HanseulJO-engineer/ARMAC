[project]
name = "focuslab-desktop"
version = "1.0.0"
description = "Native desktop workbench for CV1A static autofocus"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.9,<5",
  "matplotlib>=3.10,<4",
  "PySide6>=6.6,<7",
]

[project.scripts]
focuslab = "autofocus.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["autofocus*"]
